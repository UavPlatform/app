# 契约漂移巡检：每天比较本仓 vendored 规格的 sha256 与 backend main 上的
# spec/openapi/drone-backend.openapi.json（公开仓库，直接取 raw，无需任何 secret）。
# 不一致则本 workflow 失败（Actions 页与仓库通知可见），提示执行 tool/openapi_sync.dart + openapi_gen.dart。
# 不是 PR 门禁：backend 先合入、app 后同步是正常节奏，漂移只做可见告警。
name: Contract drift

on:
  schedule:
    - cron: '0 1 * * *' # 每天 01:00 UTC（北京时间 09:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: contract-drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Compare vendored spec sha256 with backend main
        env:
          SPEC_URL: https://raw.githubusercontent.com/UavPlatform/backend/main/spec/openapi/drone-backend.openapi.json
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$SPEC_URL" -o "$RUNNER_TEMP/backend-spec.json"
          upstream=$(sha256sum "$RUNNER_TEMP/backend-spec.json" | cut -d' ' -f1)
          vendored=$(cut -d' ' -f1 openapi/drone-backend.openapi.sha256)
          {
            echo "### OpenAPI 契约漂移巡检"
            echo "- backend main：\`$upstream\`"
            echo "- app vendored：\`$vendored\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$upstream" != "$vendored" ]; then
            echo "::error title=OpenAPI 契约漂移::app vendored 规格（$vendored）与 backend main（$upstream）不一致；请执行 OPENAPI_SOURCE=<backend 规格> dart run tool/openapi_sync.dart && dart run tool/openapi_gen.dart 并提交。"
            echo "- 结果：**不一致**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- 结果：一致" >> "$GITHUB_STEP_SUMMARY"
